name: Build AI Passport custom firmware

on:
  push:
    branches: [main]
    # 只改文档不要出固件（见 README「什么时候出新固件」）。只要有补丁/工作流/脚本变更，
    # paths-ignore 就不生效、照常构建——它只在**全部**改动都匹配时才跳过。
    paths-ignore:
      - '**.md'
  workflow_dispatch:

# 发布 Release 需要写权限；缺了会在最后一步 403
permissions:
  contents: write

jobs:
  build:
    name: Build folotoy/ai-passport (xiaozhi-esp32 @ 0d576d3 + 单一基线补丁)
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    env:
      UPSTREAM_REPO: https://github.com/78/xiaozhi-esp32.git
      # 必须是完整 40 位 SHA：短 SHA 实测 fetch 失败（couldn't find remote ref）
      UPSTREAM_SHA: 0d576d3d4c049c6f55eaf879725dc23e516511b4
      BOARD: folotoy/ai-passport
      BOARD_NAME: ai-passport
    steps:
      - name: Checkout build recipe
        uses: actions/checkout@v4
        with:
          path: recipe

      - name: Clone upstream at pinned commit
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p src && cd src
          git init -q .
          git remote add origin "$UPSTREAM_REPO"
          git fetch --depth 1 origin "$UPSTREAM_SHA"
          git checkout -q FETCH_HEAD
          echo "基线 commit：$(git log --oneline -1)"

      - name: Apply patches (must keep order)
        shell: bash
        run: |
          set -euo pipefail
          cd src
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 现行只有一个补丁：patches/0001-ai-passport-baseline.patch（= 全部本地改造，含 fw-26 状态）。
          # 后续改动方式见配方仓 README「怎么改」与 firmware/patches/README.md。
          # 循环保留成通配形式：加/减补丁都不用改这里（history/ 与 _removed/ 是非递归 glob 之外的，不会被带上）
          for p in ../recipe/patches/*.patch; do
            echo ">>> $(basename "$p")"
            if git am "$p"; then
              echo "    applied via git am"
            else
              git am --abort || true
              git apply -v "$p"
              echo "    applied via git apply"
            fi
          done
          echo "===== 累计变更（对基线）====="
          # 用 FETCH_HEAD 而不是 HEAD~N：不依赖打了几个补丁，加/减补丁都不用改这里
          git diff --shortstat FETCH_HEAD

      - name: Stamp firmware version (9.9.<run_number>)
        shell: bash
        run: |
          set -euo pipefail
          # 版本号规则（硬要求）：PROJECT_VER = 9.9.<固件编号>，固件编号 = 本次 run_number
          # = Release tag 的 fw-N。这样设备串口 `Ota: Current version:` 能直接确认跑的是哪一版。
          # 补丁 0005 只把基线设成 9.9.0（防官方 OTA 覆盖），真正的版本号在这里注入。
          VER="9.9.${{ github.run_number }}"
          sed -i "s/^set(PROJECT_VER .*$/set(PROJECT_VER \"$VER\")/" src/CMakeLists.txt
          grep -q "set(PROJECT_VER \"$VER\")" src/CMakeLists.txt
          echo "PROJECT_VER 注入为 $VER（对应 tag fw-${{ github.run_number }}）"
          grep -n PROJECT_VER src/CMakeLists.txt

      - name: Sanity checks before build
        shell: bash
        run: |
          set -euo pipefail
          cd src
          echo "===== PROJECT_VER（必须是 9.9.<run_number>，且高于云端 2.5.1）====="
          grep -n 'PROJECT_VER' CMakeLists.txt | head -2
          grep -q "set(PROJECT_VER \"9.9.${{ github.run_number }}\")" CMakeLists.txt || {
            echo "::error::PROJECT_VER 不是 9.9.${{ github.run_number }}（版本号规则见 README）"; exit 1; }
          echo "===== 新增 MCP 工具（应列出 4 个：audio.play_url / screen.show_image / screen.show_test_pattern / screen.hide_image）====="
          grep -oE '"self\.(audio|screen)\.[a-z_]+"' \
            main/boards/folotoy/ai-passport/ai_passport_board.cc | sort -u
          echo "===== 板型仍被构建脚本识别 ====="
          python scripts/build.py --list-boards | grep -i ai-passport

      - name: Build firmware
        shell: bash
        run: |
          set -euo pipefail
          cd src
          source "$IDF_PATH/export.sh"
          python scripts/build.py "$BOARD" --name "$BOARD_NAME"

      - name: Verify output
        shell: bash
        run: |
          cd src
          ls -la build/merged-binary.bin
          du -h build/merged-binary.bin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-ai-passport-custom-${{ github.sha }}
          path: src/build/merged-binary.bin
          if-no-files-found: error

      - name: Publish release asset
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fw-${{ github.run_number }}
          name: AI Passport custom firmware #${{ github.run_number }}
          body: |
            基线：78/xiaozhi-esp32 @ main 0d576d3
            补丁：0001~0007（0006 全屏图片层，板无关；0007 本板图片工具；含 PROJECT_VER 抬到 9.9.9）
            提交：${{ github.sha }}
            工具：self.audio.play_url / self.screen.show_test_pattern / self.screen.show_image / self.screen.hide_image
            烧录：见 README；起始地址 0x0。建议用 firmware/bin/刷写固件.command 或
            firmware/tools/flash_ai_passport.sh，两者都会先备份并写回 NVS(0x9000/0x4000)，
            免重新配网；merged-binary 直接烧 0x0 会清空 NVS。
          files: src/build/merged-binary.bin
